name: RLS Tenant Isolation

on:
  # Manual-only — nightly cron and PR triggers disabled to avoid noisy
  # failure emails caused by transient infra issues (e.g. Bun download 504).
  # Re-enable schedule/pull_request here when needed.
  workflow_dispatch:

concurrency:
  group: rls-tenant-isolation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Cross-tenant RLS audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check required secrets
        id: secrets_check
        run: |
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ] || [ -z "${VITE_SUPABASE_URL}" ] || [ -z "${VITE_SUPABASE_PUBLISHABLE_KEY}" ]; then
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Required Supabase secrets not configured — skipping audit (configure SUPABASE_SERVICE_ROLE_KEY, VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY in repo secrets to enable)."
          else
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run RLS tenant isolation suite
        if: steps.secrets_check.outputs.has_secrets == 'true'
        run: bunx vitest run src/test/rls-tenant-isolation.test.ts --reporter=verbose

      - name: Run sensitive data access control suite
        if: steps.secrets_check.outputs.has_secrets == 'true'
        run: bunx vitest run src/test/sensitive-access-control.test.ts --reporter=verbose

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rls-audit-logs
          path: |
            **/vitest-report.*
            **/*.log
          if-no-files-found: ignore
          retention-days: 14
