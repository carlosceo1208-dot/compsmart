name: RLS Tenant Isolation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  # Semanal (não noturno) para reduzir janelas de falha transitória
  # e o volume de e-mails; resultado é revisado na segunda-feira.
  schedule:
    - cron: "0 3 * * 1" # toda segunda-feira às 03:00 UTC (00:00 em São Paulo)

concurrency:
  group: rls-tenant-isolation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Cross-tenant RLS audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Retry: download transitório de dependências (e.g. 504) não deve
      # falhar a auditoria inteira.
      - name: Install dependencies (retry)
        run: |
          for attempt in 1 2; do
            if bun install --frozen-lockfile; then
              exit 0
            fi
            echo "::warning::bun install failed (attempt $attempt)"
            if [ "$attempt" = "2" ]; then
              exit 1
            fi
            sleep 10
          done

      - name: Check required secrets
        id: secrets_check
        run: |
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ] || [ -z "${VITE_SUPABASE_URL}" ] || [ -z "${VITE_SUPABASE_PUBLISHABLE_KEY}" ]; then
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Required Supabase secrets not configured — skipping audit (configure SUPABASE_SERVICE_ROLE_KEY, VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY in repo secrets to enable)."
          else
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run RLS tenant isolation suite
        if: steps.secrets_check.outputs.has_secrets == 'true'
        run: bunx vitest run src/test/rls-tenant-isolation.test.ts --reporter=verbose

      - name: Run sensitive data access control suite
        if: steps.secrets_check.outputs.has_secrets == 'true'
        run: bunx vitest run src/test/sensitive-access-control.test.ts --reporter=verbose

      - name: Run role matrix suite (anon/authenticated/admin/hr_manager/super_admin)
        if: steps.secrets_check.outputs.has_secrets == 'true'
        run: bunx vitest run src/test/rls-role-matrix.test.ts --reporter=verbose

      - name: Run extended matrix + negative auth suite (invalid/expired JWTs, escalation)
        if: steps.secrets_check.outputs.has_secrets == 'true'
        run: bunx vitest run src/test/rls-negative-and-extended.test.ts --reporter=verbose

      - name: Run E2E login + tenant + edge-function permissions suite
        if: steps.secrets_check.outputs.has_secrets == 'true'
        run: bunx vitest run src/test/e2e-login-tenant-permissions.test.ts --reporter=verbose

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rls-audit-logs
          path: |
            **/vitest-report.*
            **/*.log
          if-no-files-found: ignore
          retention-days: 14
