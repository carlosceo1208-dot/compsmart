name: RLS Tenant Isolation

on:
  pull_request:
    branches: [main]
  schedule:
    # Nightly at 03:17 UTC (off-peak, avoids hourly congestion)
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: rls-tenant-isolation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Cross-tenant RLS audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify required secret is present
        run: |
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY is not set in repo secrets — the audit will silently skip."
            exit 1
          fi
          echo "Service role key present (length: ${#SUPABASE_SERVICE_ROLE_KEY})"

      - name: Run RLS tenant isolation suite
        run: bunx vitest run src/test/rls-tenant-isolation.test.ts --reporter=verbose

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rls-audit-logs
          path: |
            **/vitest-report.*
            **/*.log
          if-no-files-found: ignore
          retention-days: 14
