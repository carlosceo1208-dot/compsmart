name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, dead-code & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Fails on any unused import (unused-imports/no-unused-imports = error)
      - name: ESLint
        run: bun run lint

      # Catches TypeScript regressions (e.g. recharts label typing)
      - name: TypeScript typecheck
        run: bunx tsgo --noEmit -p tsconfig.app.json

      # Fails on unused files, exports, types or dependencies
      - name: Dead-code scan (knip)
        run: bun run dead-code:ci

      # Production build must succeed
      - name: Build
        run: bun run build
