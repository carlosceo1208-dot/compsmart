name: CI

# Runs on every pull request targeting main and every push to main.
# To enforce as a required status check before merge, add the job name
# "Lint, typecheck, test, dead-code & build" to Branch Protection rules
# for `main` in GitHub → Settings → Branches → Branch protection rules.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, dead-code & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      # Cache Bun's global install cache, keyed on the lockfile so results
      # stay deterministic. A lockfile change busts the cache automatically.
      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # Cache Vite + tsgo intermediate outputs to speed up build/typecheck.
      # Keyed by source tree hash so any code change produces a fresh build.
      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.vite
            node_modules/.cache
            .tsbuildinfo
          key: ${{ runner.os }}-build-${{ hashFiles('src/**/*.{ts,tsx}', 'tsconfig*.json', 'vite.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Fails on any unused import (unused-imports/no-unused-imports = error)
      - name: ESLint
        run: bun run lint

      # Catches TypeScript regressions (e.g. recharts label typing)
      - name: TypeScript typecheck
        run: bunx tsgo --noEmit -p tsconfig.app.json

      # Unit tests (Vitest + React Testing Library) — includes chart regressions
      - name: Unit tests
        run: bun run test

      # Fails on unused files, exports, types or dependencies
      - name: Dead-code scan (knip)
        run: bun run dead-code:ci

      # Production build must succeed
      - name: Build
        run: bun run build
